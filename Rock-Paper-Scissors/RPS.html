<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    body {
      background-color: rgb(25, 25, 25);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
    }

    .Title {
      color: white;
      font-weight: bold;
      font-size: 50px;
      margin-bottom: 20px;
    }

    .gameBtn {
      background-color: rgb(25, 25, 25);
      border-radius: 50%;
      border: 5px solid #eee;
      cursor: pointer;
      margin: 10px;
      padding: 30px;
    }

    .icon {
      height: 50px;
    }

    .resultOnPage {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .yourMoveAndComputerMove,
    .RPCScore {
      font-size: 20px;
      margin: 5px 0;
    }

    .resetBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff4444;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="Title">
    Rock Paper Scissors!!!
  </div>

  <button onclick="pickComputerMove('rock')" class="gameBtn">
    <img src="rock-emoji.png" alt="ROCK" class="icon">
  </button>

  <button onclick="pickComputerMove('paper')" class="gameBtn">
    <img src="paper-emoji.png" alt="PAPER" class="icon">
  </button>

  <button onclick="pickComputerMove('scissors')" class="gameBtn">
    <img src="scissors-emoji.png" alt="SCISSORS" class="icon">
  </button>

  <p class="resultOnPage"></p>
  <p class="yourMoveAndComputerMove"></p>
  <p class="RPCScore"></p>

  <button onclick="resetScore()" class="resetBtn">Reset Score</button>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    function pickComputerMove(userMove) {
      const randomNum = Math.random();
      let cmove = "";

      if (randomNum < 1 / 3) {
        cmove = "rock";
      } else if (randomNum < 2 / 3) {
        cmove = "paper";
      } else {
        cmove = "scissors";
      }

      let result = "";
      if (cmove === userMove) {
        result = "Tie";
      } else if (
        (cmove === "rock" && userMove === "paper") ||
        (cmove === "paper" && userMove === "scissors") ||
        (cmove === "scissors" && userMove === "rock")
      ) {
        result = "Win";
      } else {
        result = "Lose";
      }

      if (result === 'Win') {
        score.wins++;
      } else if (result === 'Lose') {
        score.losses++;
      } else {
        score.ties++;
      }

      document.querySelector('.yourMoveAndComputerMove').innerHTML =
        `You <img src="${userMove}-emoji.png" class="icon"> 
         <img src="${cmove}-emoji.png" class="icon"> Computer`;

      document.querySelector('.resultOnPage').innerHTML = `You ${result}`;

      localStorage.setItem('score', JSON.stringify(score));
      updateScoreOnWebPage();
    }

    function updateScoreOnWebPage() {
      document.querySelector('.RPCScore').innerHTML =
        `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function resetScore() {
      score = { wins: 0, losses: 0, ties: 0 };
      localStorage.removeItem('score');
      updateScoreOnWebPage();
      document.querySelector('.yourMoveAndComputerMove').innerHTML = '';
      document.querySelector('.resultOnPage').innerHTML = '';
    }

    // Initialize score display
    updateScoreOnWebPage();
  </script>
</body>

</html>
